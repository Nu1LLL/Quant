name: Quant unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r Spot_Multi_Strategy/requirements.txt 'pytest>=8,<10'
      - name: Run unit tests
        working-directory: Spot_Multi_Strategy
        env:
          PYTHONPATH: tests
        run: python -m pytest tests -q
